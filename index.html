<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Predator 阿爾法獵手 — 澳門 Gen Z 全場景 AI 數字生態</title>
<style>
:root{
  --bg-gradient: linear-gradient(145deg, #f0f4fa 0%, #dfe7f2 100%);
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.8);
  --glass-border: rgba(255,255,255,0.75);
  --text-primary:#1e293b;
  --text-secondary:#5b6b82;
  --text-faint:#8ca0b8;
  --shadow: 0 8px 28px rgba(30,41,59,0.08);
  --gold:#b8860b; --purple:#6a1b9a; --teal:#0f766e; --coral:#e0653a; --blue:#2f5fd0; --pink:#c2410c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--bg-gradient); color:var(--text-primary); min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 12% 8%, rgba(184,134,11,0.09), transparent 60%),
    radial-gradient(700px 500px at 88% 18%, rgba(106,27,154,0.07), transparent 60%),
    radial-gradient(600px 500px at 50% 95%, rgba(47,95,208,0.07), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 24px 40px;
  display:flex;flex-direction:column;align-items:center;}
.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);}

/* 頂部品牌欄 */
.topbar{width:100%;display:flex;align-items:center;gap:14px;padding:12px 20px;margin-bottom:18px;flex-wrap:wrap;}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1e293b,#334155);
  display:flex;align-items:center;justify-content:center;color:#f5d38a;font-weight:800;font-size:19px;
  box-shadow:0 6px 16px rgba(30,41,59,.25);flex-shrink:0;}
.brand h1{font-size:1.12rem;font-weight:800;}
.brand .sub{font-size:.66rem;color:var(--text-secondary);letter-spacing:1.2px;}
.jump-tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.jtab{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;
  font-size:.74rem;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;transition:all .18s;}
.jtab:hover{background:rgba(255,255,255,.7);color:var(--text-primary);}
.jtab.active{background:#1e293b;color:#fff;box-shadow:0 5px 14px rgba(30,41,59,.25);}

/* 手機 */
.phone-stage{display:flex;flex-direction:column;align-items:center;gap:12px;}
.hint-pill{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:600;
  color:var(--text-secondary);background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  border-radius:999px;padding:7px 16px;backdrop-filter:blur(10px);}
.hint-pill .pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;transform:scale(.7);}}
.phone{width:370px;height:760px;border-radius:52px;position:relative;background:#0d1524;padding:12px;
  box-shadow:0 30px 70px rgba(15,23,42,.35),0 0 0 2px rgba(255,255,255,.5),inset 0 0 0 2px #2b3953;}
.phone-screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;
  background:#f6f8fc;display:flex;flex-direction:column;}
.phone-notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:110px;height:26px;background:#0d1524;border-radius:20px;z-index:60;}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 4px;font-size:.72rem;font-weight:700;position:relative;z-index:5;background:transparent;}
.app-view{flex:1;position:relative;overflow:hidden;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 15px 18px;
  scrollbar-width:none;animation:fadeUp .3s ease;}
.screen::-webkit-scrollbar{display:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.subpage{position:absolute;inset:0;background:#f6f8fc;z-index:40;overflow-y:auto;scrollbar-width:none;
  animation:slideIn .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;}
.subpage::-webkit-scrollbar{display:none;}
@keyframes slideIn{from{transform:translateX(100%);}to{transform:none;}}
.sub-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;flex-shrink:0;
  background:rgba(246,248,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e8edf4;
  position:sticky;top:0;z-index:5;}
.back-btn{border:none;background:#eef2f8;width:32px;height:32px;border-radius:10px;font-size:15px;
  cursor:pointer;color:var(--text-primary);flex-shrink:0;}
.sub-title{font-size:.95rem;font-weight:800;}
.sub-body{padding:12px 14px 20px;flex:1;}
.app-tabbar{height:60px;flex-shrink:0;display:flex;border-top:1px solid #e5eaf2;
  background:rgba(255,255,255,.94);position:relative;z-index:10;}
.app-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.55rem;color:var(--text-faint);cursor:pointer;border:none;background:none;font-family:inherit;transition:color .15s;}
.app-tab .ico{font-size:16px;}
.app-tab.on{color:var(--text-primary);font-weight:800;}

/* App 通用 */
.a-title{font-size:1.08rem;font-weight:800;}
.a-sub{font-size:.7rem;color:var(--text-secondary);margin-top:2px;}
.a-card{background:#fff;border-radius:15px;padding:12px 13px;margin-top:10px;
  box-shadow:0 3px 12px rgba(30,41,59,.06);border:1px solid #edf1f7;}
.a-chip{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:999px;}
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
  font-family:inherit;background:#1e293b;color:#fff;font-size:.76rem;font-weight:700;padding:9px 15px;
  border-radius:12px;transition:transform .15s,box-shadow .15s;}
.a-btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(30,41,59,.25);}
.a-btn.ghost{background:#eef2f8;color:var(--text-primary);}
.a-btn.gold{background:linear-gradient(135deg,#b8860b,#d4a52e);}
.bar{height:7px;border-radius:99px;background:#e8edf5;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);}
.sec-label{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 2px;
  font-size:.8rem;font-weight:800;}
.sec-label span{font-size:.6rem;color:var(--text-faint);font-weight:600;}

/* 首頁 */
.home-hero{border-radius:18px;padding:15px;color:#fff;margin-top:10px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1e293b 0%,#3b4a6b 55%,#6a1b9a 130%);}
.home-hero::after{content:"α";position:absolute;right:-8px;bottom:-32px;font-size:110px;font-weight:800;
  color:rgba(245,211,138,.12);}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.home-cell{border-radius:16px;padding:13px;cursor:pointer;transition:transform .15s,box-shadow .15s;
  border:1px solid #edf1f7;background:#fff;box-shadow:0 3px 10px rgba(30,41,59,.05);}
.home-cell:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,41,59,.1);}
.home-cell .hc-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:18px;margin-bottom:8px;}
.home-cell .hc-t{font-size:.8rem;font-weight:800;}
.home-cell .hc-d{font-size:.6rem;color:var(--text-faint);margin-top:3px;line-height:1.5;}
.home-quick{display:flex;gap:8px;margin-top:12px;}
.home-quick .a-card{flex:1;margin-top:0;text-align:center;padding:10px 6px;}
.home-quick .qv{font-size:.95rem;font-weight:800;}
.home-quick .ql{font-size:.56rem;color:var(--text-faint);margin-top:2px;}

/* 資訊 · 人群切換 */
.persona-row{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.persona-row::-webkit-scrollbar{display:none;}
.pchip{flex-shrink:0;border:1.5px solid #e2e8f1;background:#fff;border-radius:999px;padding:6px 12px;
  font-size:.68rem;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .15s;}
.pchip.on{background:#1e293b;color:#fff;border-color:#1e293b;}
.feed-item{display:flex;gap:10px;align-items:flex-start;}
.feed-item .fico{width:36px;height:36px;border-radius:11px;flex-shrink:0;font-size:16px;
  display:flex;align-items:center;justify-content:center;}
.feed-item .ft{font-size:.78rem;font-weight:700;line-height:1.45;}
.feed-item .fm{font-size:.62rem;color:var(--text-faint);margin-top:3px;line-height:1.5;}
.tagrow{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.match-pct{margin-left:auto;flex-shrink:0;text-align:right;}
.match-pct .p{font-size:.86rem;font-weight:800;color:var(--teal);}
.match-pct .l{font-size:.55rem;color:var(--text-faint);}
.news-flash{display:flex;gap:10px;padding:9px 2px;border-bottom:1px dashed #e8edf4;font-size:.74rem;line-height:1.5;}
.news-flash:last-child{border:none;}
.news-flash .t{color:var(--text-faint);font-size:.66rem;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums;}
.up{color:#d64545;font-weight:800;} .down{color:#1a9e6b;font-weight:800;}
.mkt-tag{font-size:.56rem;font-weight:800;padding:1px 7px;border-radius:6px;background:#eef2f8;color:var(--text-secondary);margin-right:5px;}

/* AI 履歷流程 */
.step-dots{display:flex;gap:6px;align-items:center;margin-top:12px;}
.step-dot{flex:1;height:4px;border-radius:99px;background:#e2e8f1;}
.step-dot.did{background:var(--gold);}
.resume-box{background:#f8fafd;border:1.5px dashed #d5deeb;border-radius:13px;padding:12px;
  font-size:.72rem;line-height:1.75;color:var(--text-secondary);white-space:pre-line;}
.ai-gen{opacity:0;transform:translateY(8px);transition:all .5s ease;}
.ai-gen.show{opacity:1;transform:none;}
.compare-grid{display:grid;grid-template-columns:1fr;gap:9px;}
.comp-card{border-radius:13px;padding:11px 13px;font-size:.7rem;line-height:1.7;}
.comp-card.before{background:#f4f6fa;border:1px solid #e2e8f1;color:var(--text-secondary);}
.comp-card.after{background:#f2fbf6;border:1.5px solid #bfe6cf;color:#0c6b47;}
.comp-card b{display:block;font-size:.74rem;margin-bottom:4px;}

/* 智學 */
.flow-steps{display:flex;align-items:center;gap:6px;margin-top:10px;}
.flow-step{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:#f4f6fa;
  border:1.5px solid #e5eaf2;cursor:pointer;transition:all .15s;}
.flow-step:hover{border-color:var(--purple);}
.flow-step .fs-n{font-size:.62rem;font-weight:800;color:var(--purple);}
.flow-step .fs-t{font-size:.68rem;font-weight:800;margin-top:2px;}
.flow-step .fs-d{font-size:.54rem;color:var(--text-faint);margin-top:2px;}
.flow-arrow{color:#c3cede;font-size:12px;}
.course-item{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed #edf1f7;}
.course-item:last-child{border:none;}
.course-item .cv{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.src-tag{font-size:.55rem;font-weight:800;padding:2px 7px;border-radius:6px;}
.src-b{background:#fdeef2;color:#d6336c;} .src-y{background:#fdeaea;color:#d64545;} .src-ai{background:#f0e9fa;color:var(--purple);}
.paper-item{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #edf1f7;font-size:.74rem;}
.paper-item:last-child{border:none;}
.q-opt{display:block;width:100%;text-align:left;margin-top:7px;padding:9px 12px;border-radius:11px;
  border:1.5px solid #e2e8f1;background:#f8fafd;font-size:.76rem;cursor:pointer;font-family:inherit;
  transition:all .15s;color:var(--text-primary);}
.q-opt:hover{border-color:var(--blue);}
.q-opt.right{background:#e8f7f0;border-color:#1a9e6b;color:#0c6b47;font-weight:700;}
.q-opt.wrong{background:#fdeeee;border-color:#d65a5a;color:#a03030;font-weight:700;}

/* 速配 */
.swipe-deck{position:relative;height:320px;margin-top:10px;}
.swipe-card{position:absolute;inset:0;background:#fff;border-radius:20px;padding:17px;
  box-shadow:0 10px 30px rgba(30,41,59,.12);border:1px solid #edf1f7;cursor:grab;user-select:none;
  touch-action:none;display:flex;flex-direction:column;transition:transform .25s ease,opacity .25s ease;}
.swipe-card:active{cursor:grabbing;}
.sc-avatar{width:60px;height:60px;border-radius:17px;font-size:26px;display:flex;align-items:center;
  justify-content:center;margin-bottom:9px;}
.sc-name{font-size:.98rem;font-weight:800;}
.sc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.sc-tag{font-size:.6rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f8;color:var(--text-secondary);}
.sc-bio{font-size:.72rem;color:var(--text-secondary);line-height:1.6;margin-top:10px;flex:1;}
.sc-price{font-size:.88rem;font-weight:800;color:var(--gold);}
.stamp{position:absolute;top:18px;font-size:1rem;font-weight:900;padding:5px 13px;border-radius:10px;
  border:3px solid;opacity:0;letter-spacing:2px;}
.stamp.like{right:14px;color:#1a9e6b;border-color:#1a9e6b;transform:rotate(12deg);}
.stamp.nope{left:14px;color:#d65a5a;border-color:#d65a5a;transform:rotate(-12deg);}
.swipe-actions{display:flex;justify-content:center;gap:20px;margin-top:10px;}
.sa-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:19px;
  background:#fff;box-shadow:0 5px 16px rgba(30,41,59,.12);transition:transform .15s;}
.sa-btn:hover{transform:scale(1.12);}
.hist-btn{position:relative;border:none;background:#fff;width:34px;height:34px;border-radius:11px;
  cursor:pointer;font-size:15px;box-shadow:0 3px 10px rgba(30,41,59,.1);}
.hist-badge{position:absolute;top:-5px;right:-5px;background:var(--coral);color:#fff;font-size:.55rem;
  font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.overlay{position:absolute;inset:0;background:rgba(13,21,36,.5);backdrop-filter:blur(4px);z-index:50;
  display:none;align-items:flex-end;}
.overlay.show{display:flex;animation:fadeUp .25s;}
.sheet{background:#f6f8fc;width:100%;max-height:82%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;}
.sheet-head{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid #e8edf4;}
.sheet-tabs{display:flex;gap:6px;margin:10px 16px 0;}
.sheet-tabs .pchip.on{background:var(--coral);border-color:var(--coral);}
.sheet-list{padding:10px 14px 18px;overflow-y:auto;}
.hist-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:13px;padding:10px 12px;
  margin-bottom:8px;border:1px solid #edf1f7;}
.hist-item .ha{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hist-item .hn{font-size:.76rem;font-weight:800;}
.hist-item .hd{font-size:.6rem;color:var(--text-faint);margin-top:2px;}
.undo-btn{margin-left:auto;border:none;background:#fdf1e7;color:var(--coral);font-size:.64rem;font-weight:800;
  padding:6px 11px;border-radius:9px;cursor:pointer;font-family:inherit;flex-shrink:0;}

/* 運動 */
.xp-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.lv-badge{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0f766e,#14b8a6);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.lv-badge .n{font-size:.9rem;font-weight:800;line-height:1;}
.lv-badge .l{font-size:.5rem;opacity:.85;}
.task-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #edf1f7;font-size:.74rem;}
.task-row:last-child{border:none;}
.task-check{width:20px;height:20px;border-radius:7px;border:2px solid #d5deeb;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .15s;background:#fff;}
.task-check.did{background:var(--teal);border-color:var(--teal);}
.pose-demo{position:relative;border-radius:16px;overflow:hidden;background:#0f1a2e;height:210px;margin-top:10px;}
.pose-demo svg{position:absolute;inset:0;width:100%;height:100%;}
.pose-hud{position:absolute;top:10px;left:10px;font-size:.6rem;color:#5eead4;font-weight:700;
  background:rgba(15,23,42,.6);padding:4px 9px;border-radius:8px;backdrop-filter:blur(4px);}
.pose-warn{position:absolute;bottom:10px;left:10px;right:10px;font-size:.64rem;color:#fecaca;
  background:rgba(180,40,40,.35);padding:7px 11px;border-radius:10px;backdrop-filter:blur(4px);line-height:1.5;}
.pose-ok{position:absolute;bottom:10px;left:10px;right:10px;font-size:.64rem;color:#a7f3d0;
  background:rgba(15,118,110,.4);padding:7px 11px;border-radius:10px;backdrop-filter:blur(4px);line-height:1.5;display:none;}
.vid-card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:9px;
  margin-top:9px;border:1px solid #edf1f7;cursor:pointer;transition:transform .15s;}
.vid-card:hover{transform:translateY(-1px);}
.vid-thumb{width:96px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#1e293b;}
.vid-card .vt{font-size:.72rem;font-weight:800;line-height:1.45;}
.vid-card .vm{font-size:.58rem;color:var(--text-faint);margin-top:3px;}
.play-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
  border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;backdrop-filter:blur(4px);}
.video-modal{position:absolute;inset:0;z-index:55;background:rgba(10,16,28,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;padding:18px;}
.video-modal.show{display:flex;animation:fadeUp .25s;}
.video-modal iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:14px;}
.vm-close{margin-top:12px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:.72rem;
  font-weight:700;padding:8px 20px;border-radius:999px;cursor:pointer;font-family:inherit;}
.vm-cap{color:#94a3b8;font-size:.62rem;margin-top:10px;text-align:center;line-height:1.6;}

/* 二手 */
.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.goods{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #edf1f7;
  box-shadow:0 3px 10px rgba(30,41,59,.05);cursor:pointer;transition:transform .15s;}
.goods:hover{transform:translateY(-2px);}
.goods .gimg{height:72px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.goods .ginfo{padding:8px 10px;}
.goods .gt{font-size:.7rem;font-weight:700;line-height:1.35;}
.goods .gp{font-size:.78rem;font-weight:800;color:var(--coral);margin-top:3px;}
.goods .gd{font-size:.58rem;color:var(--text-faint);margin-top:2px;}
.detail-hero{height:130px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:56px;}
.chat-list-item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:11px 12px;
  margin-bottom:9px;border:1px solid #edf1f7;cursor:pointer;}
.chat-av{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.chat-item-t{font-size:.78rem;font-weight:800;}
.chat-item-m{font-size:.64rem;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:190px;}
.chat-time{margin-left:auto;font-size:.56rem;color:var(--text-faint);flex-shrink:0;}
.chat-body{flex:1;padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.bubble{max-width:78%;padding:8px 12px;border-radius:15px;font-size:.74rem;line-height:1.55;}

});

  curTab = tab;

  e.style.display='block';
  e.textContent=(ok?'✅ 正確！':'💡 再諗下。')+' AI 解析：'+exp;
}

function setDeck(type){
  deckType=type; cardIdx=0;
  const st=document.getElementById('segTutor'), sb=document.getElementById('segBuddy');
  if(st&&sb){
    [[st,type==='tutor'],[sb,type==='buddy']].forEach(([b,on])=>{
      b.style.background=on?'#1e293b':''; b.style.color=on?'#fff':'';
    });
  }
  renderDeck();
}
function renderDeck(){
  const deck=document.getElementById('deck');
  if(!deck) return;
  const cards=DECKS[deckKey(deckType)];
  deck.innerHTML='';
  if(cardIdx>=cards.length){
    deck.innerHTML=`<div style="display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text-faint);">
      <div style="font-size:2rem;">🃏</div><div style="font-size:.76rem;">本批卡片已睇晒</div>
      <button class="a-btn ghost" onclick="cardIdx=0;renderDeck();">重新載入</button></div>`;
    return;
  }
  for(let i=Math.min(cardIdx+1,cards.length-1); i>=cardIdx; i--){
    const c=cards[i];
    const el=document.createElement('div');
    el.className='swipe-card';
    el.style.transform=i>cardIdx?'scale(.94) translateY(14px)':'none';
    el.style.zIndex=i>cardIdx?1:2;
    el.innerHTML=`
      <span class="stamp like">LIKE 💛</span><span class="stamp nope">NOPE</span>
      <div class="sc-avatar" style="background:${c.bg};">${c.av}</div>
      <div class="sc-name">${c.name}</div>
      <div class="sc-tags">${c.tags.map(t=>`<span class="sc-tag">${t}</span>`).join('')}</div>
      <div class="sc-bio">${c.bio}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span class="sc-price">${c.price}</span>
        <span style="font-size:.58rem;color:var(--text-faint);">契合度 ${92-(i-cardIdx)*4}%</span>
      </div>`;
    if(i===cardIdx) makeDraggable(el);
    deck.appendChild(el);
  }
}
function makeDraggable(el){
  let sx=0,dx=0,drag=false;
  const like=el.querySelector('.like'), nope=el.querySelector('.nope');
  const start=x=>{drag=true;sx=x;el.style.transition='none';};
  const move=x=>{ if(!drag)return; dx=x-sx;
    el.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`;
    like.style.opacity=Math.max(0,dx/90); nope.style.opacity=Math.max(0,-dx/90); };
  const end=()=>{ if(!drag)return; drag=false; el.style.transition='transform .25s ease,opacity .25s ease';
    if(Math.abs(dx)>90){ fly(el, dx>0?1:-1); } else { el.style.transform='none'; like.style.opacity=0;nope.style.opacity=0; } dx=0; };
  el.addEventListener('mousedown',e=>start(e.clientX));
  window.addEventListener('mousemove',e=>move(e.clientX));
  window.addEventListener('mouseup',end);
  el.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
  el.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
  el.addEventListener('touchend',end);
}
function fly(el,dir){
  const c=DECKS[deckKey(deckType)][cardIdx];
  swipeHist[dir>0?'liked':'passed'].push({type:deckType, idx:cardIdx, data:c, role:curRole});
  updateHistBadge();
  el.style.transform=`translateX(${dir*420}px) rotate(${dir*22}deg)`;
  el.style.opacity=0;
  if(dir>0) setTimeout(()=>openMatchToast(c),260);
  setTimeout(()=>{cardIdx++;renderDeck();},280);
}
function swipeOut(dir){
  const top=document.getElementById('deck')?.querySelector('.swipe-card');
  if(top) fly(top,dir);
}
function updateHistBadge(){
  const n=swipeHist.liked.length+swipeHist.passed.length;
  const b=document.getElementById('histBadge');
  if(b){ b.style.display=n?'flex':'none'; b.textContent=n; }

    <button class="a-btn" onclick="this.closest('.overlay').remove()">開始對話</button></div>`;
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  scr.appendChild(ov);
}

let histTab='passed';
function openHist(){
  const scr=document.getElementById('scr');
  if(!scr) return;
  const ov=document.createElement('div');
  ov.className='overlay show'; ov.id='histOv';
  ov.innerHTML=`<div class="sheet">

      <button class="pchip on" id="htP" onclick="histTab='passed';renderHistList();">✖️ 已左滑 (${swipeHist.passed.length})</button>
    </div>
    <div class="sheet-list" id="histList"></div>
  </div>`;
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  scr.appendChild(ov);
  renderHistList();
}
function renderHistList(){
  document.getElementById('htL').classList.toggle('on',histTab==='liked');
  document.getElementById('htP').classList.toggle('on',histTab==='passed');
  document.getElementById('htL').textContent=`💛 已右滑 (${swipeHist.liked.length})`;
  document.getElementById('htP').textContent=`✖️ 已左滑 (${swipeHist.passed.length})`;
  const list=document.getElementById('histList');
  const arr=swipeHist[histTab];
  list.innerHTML = arr.length ? arr.map((h,i)=>`
    <div class="hist-item">
      <div class="ha" style="background:${h.data.bg};">${h.data.av}</div>
      <div><div class="hn">${h.data.name}</div>
        <div class="hd">${h.type==='tutor'?(h.role==='worker'?'學生需求':'補習老師'):(h.role==='worker'?'遊客需求':'旅遊搭子')} · ${h.data.price}</div></div>
      <button class="undo-btn" onclick="undoSwipe('${histTab}',${i})">↩ 收回重劃</button>
    </div>`).join('')
    : `<div style="text-align:center;color:var(--text-faint);font-size:.72rem;padding:26px 0;">暫無記錄 — 去滑幾張卡試下</div>`;
}
function undoSwipe(tab,i){
  const h=swipeHist[tab].splice(i,1)[0];
  updateHistBadge();
  renderHistList();
  /* 把卡片放回對應牌堆頂部 */
  const key=deckKey(h.type);
  if(h.type===deckType){
    cardIdx=Math.min(h.idx, DECKS[key].length-1);
    renderDeck();
  } else {
    deckType=h.type; setDeck(h.type); cardIdx=Math.min(h.idx, DECKS[key].length-1); renderDeck();
  }
  toast(`已收回「${h.data.name}」— 可以重新選擇`);
}

function openChatList(){
  push('💬 訊息', Object.keys(chats).map(name=>{

    const last=c.msgs[c.msgs.length-1];
    return `<div class="chat-list-item" onclick="openChat('${name}')">

  }).join('') + `<div style="text-align:center;font-size:.6rem;color:var(--text-faint);padding:14px 0;">所有對話均喺 App 內加密進行</div>`);
}
function openChat(name){
  const c=chats[name]||(chats[name]={av:'🙂',bg:'#eef2f8',msgs:[]});
  const el=push(`💬 ${name}`, '');
  el.querySelector('.sub-body').style.display='flex';
  el.querySelector('.sub-body').style.flexDirection='column';
  el.querySelector('.sub-body').style.padding='0';
  el.querySelector('.sub-body').innerHTML=`
    <div class="chat-body" id="chatBody">${c.msgs.map(m=>`<div class="bubble ${m.me?'me':'them'}">${m.txt}</div>`).join('')}</div>
    <div class="chat-input">
      <input id="chatIn" placeholder="輸入訊息…" onkeydown="if(event.key==='Enter')sendMsg('${name}')">
      <button onclick="sendMsg('${name}')">➤</button>
    </div>`;
  const cb=el.querySelector('#chatBody');
  setTimeout(()=>cb.scrollTop=cb.scrollHeight,50);
}
const AUTO_REPLY=['好呀！咁我哋約時間交收？','可以少少議價㗎 😄','冇問題，聽日下晝得唔得？','好，到時見！記得喺人多地方交收 👍'];
let replyIdx=0;
function sendMsg(name){
  const inp=document.getElementById('chatIn');
  const txt=inp.value.trim();
  if(!txt) return;
  chats[name].msgs.push({me:1,txt});
  const cb=document.getElementById('chatBody');
  cb.insertAdjacentHTML('beforeend',`<div class="bubble me">${txt.replace(/</g,'&lt;')}</div>`);
  inp.value=''; cb.scrollTop=cb.scrollHeight;
  setTimeout(()=>{
    const r=AUTO_REPLY[replyIdx++ % AUTO_REPLY.length];
    chats[name].msgs.push({me:0,txt:r});
    if(document.getElementById('chatBody')){
      cb.insertAdjacentHTML('beforeend',`<div class="bubble them">${r}</div>`);
      cb.scrollTop=cb.scrollHeight;
    }
  },900);
}

let tourIdx=0;
function startTour(){ tourIdx=0; document.getElementById('tourOv').classList.add('show'); renderTour(); }
function closeTour(){ document.getElementById('tourOv').classList.remove('show'); }
function tourStep(d){ tourIdx=Math.min(Math.max(tourIdx+d,0),TOUR.length-1); renderTour(); }
function renderTour(){
  const t=TOUR[tourIdx];
  document.getElementById('tourCard').innerHTML=`
    <div class="tour-stepnum">0${tourIdx+1} / 0${TOUR.length}</div>
    <div class="tour-progress" style="margin-top:6px;"><i style="width:${(tourIdx+1)/TOUR.length*100}%;"></i></div>
    <div class="tour-emoji">${t.emoji}</div>
    <div class="tour-title">${t.title}</div>
    <div class="tour-sub">${t.sub}</div>
    <div class="tour-body">${t.body}</div>
    <div style="text-align:center;margin-bottom:10px;"><span class="tour-hl">${t.hl}</span></div>
    <div class="tour-dots">${TOUR.map((_,i)=>`<i class="${i===tourIdx?'on':''}"></i>`).join('')}</div>
    <div class="tour-nav">
      <button class="t-btn skip" onclick="closeTour()">跳過</button><span class="spacer"></span>
      ${tourIdx>0?'<button class="t-btn prev" onclick="tourStep(-1)">← 上一步</button>':''}
      ${t.last?'<button class="t-btn next" onclick="closeTour();go(\'home\')">開始體驗 🚀</button>'
              :'<button class="t-btn next" onclick="tourStep(1)">下一步 →</button>'}
    </div>`;
}

function toast(msg){
  let t=document.getElementById('apToast');
  if(!t){ t=document.createElement('div'); t.id='apToast';
    t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;font-size:.78rem;font-weight:600;padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:999;transition:opacity .3s;';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>{t.style.opacity=0;},2100);
}
